# Babel deployment on the server (copied to /opt/babel by the release workflows).
# Image tags are set by the release workflows through BABEL_API_TAG and BABEL_WEB_TAG.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/jouskaio/babel-api:${BABEL_API_TAG:-latest}
    container_name: babel-api
    env_file: .env
    environment:
      BABEL_DATABASE_URL: postgresql+asyncpg://babel:${BABEL_DB_PASSWORD:?set BABEL_DB_PASSWORD in .env}@db:5432/babel
      BABEL_PUBLIC_URL: https://babel.jouskaio.me
      # IONOS mailbox; the password (BABEL_SMTP_PASSWORD) stays in .env on the server.
      BABEL_SMTP_HOST: smtp.ionos.fr
      BABEL_SMTP_PORT: "587"
      BABEL_SMTP_USERNAME: contact@jouskaio.me
      BABEL_MAIL_FROM: Babel <contact@jouskaio.me>
      # Book files (ADR 0010), on the NAS share mounted at /srv/babel-files.
      BABEL_FILES_DIR: /data/files
    ports:
      - "8000:8000"
    volumes:
      - /srv/babel-files:/data/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  # Only reachable by the API, on the internal compose network: no published port.
  db:
    image: postgres:17-alpine
    container_name: babel-db
    environment:
      POSTGRES_USER: babel
      POSTGRES_DB: babel
      POSTGRES_PASSWORD: ${BABEL_DB_PASSWORD:?set BABEL_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babel -d babel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  web:
    image: ghcr.io/jouskaio/babel-web:${BABEL_WEB_TAG:-latest}
    container_name: babel-web
    ports:
      - "8090:8080"
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

volumes:
  db-data:
