# Babel deployment on the server (copied to /opt/babel by the release workflows).
# Image tags are set by the release workflows through BABEL_API_TAG and BABEL_WEB_TAG.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/jouskaio/babel-api:${BABEL_API_TAG:-latest}
    container_name: babel-api
    env_file: .env
    environment:
      BABEL_DATABASE_URL: postgresql+asyncpg://babel:${BABEL_DB_PASSWORD:?set BABEL_DB_PASSWORD in .env}@db:5432/babel
      BABEL_PUBLIC_URL: https://babel.jouskaio.me
      # IONOS mailbox; the password (BABEL_SMTP_PASSWORD) stays in .env on the server.
      BABEL_SMTP_HOST: smtp.ionos.fr
      BABEL_SMTP_PORT: "587"
      BABEL_SMTP_USERNAME: contact@jouskaio.me
      BABEL_MAIL_FROM: Babel <contact@jouskaio.me>
      # Book files (ADR 0010), on the NAS share mounted at /srv/babel-files.
      BABEL_FILES_DIR: /data/files
      # Translation of books and long passages (the LibreTranslate below, on the internal network).
      BABEL_TRANSLATE_URL: http://translate:5000
    ports:
      - "8000:8000"
    volumes:
      - /srv/babel-files:/data/files
      # Files only the server holds, such as the Firebase service account (push).
      - /opt/babel/secrets:/run/babel-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  # Only reachable by the API, on the internal compose network: no published port.
  db:
    image: postgres:17-alpine
    container_name: babel-db
    environment:
      POSTGRES_USER: babel
      POSTGRES_DB: babel
      POSTGRES_PASSWORD: ${BABEL_DB_PASSWORD:?set BABEL_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babel -d babel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  # Machine translation, only reachable by the API. The language models are downloaded the first
  # time it starts (a few hundred MB per pair): the first start takes a while.
  translate:
    image: libretranslate/libretranslate:latest
    container_name: babel-translate
    environment:
      LT_LOAD_ONLY: en,fr,es,de,it,pt,ja
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "2"
    volumes:
      - translate-models:/home/libretranslate/.local
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging

  # Nightly dump of the database, kept 14 days in /opt/babel/backups (the book files live on the
  # NAS: back that share up separately). Restore: see infra/README.md.
  backup:
    image: postgres:17-alpine
    container_name: babel-backup
    environment:
      PGPASSWORD: ${BABEL_DB_PASSWORD:?set BABEL_DB_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%F)
          if pg_dump -h db -U babel babel | gzip > /backups/babel-$$stamp.sql.gz.part; then
            mv /backups/babel-$$stamp.sql.gz.part /backups/babel-$$stamp.sql.gz
          else
            rm -f /backups/babel-$$stamp.sql.gz.part
          fi
          find /backups -name 'babel-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - /opt/babel/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  web:
    image: ghcr.io/jouskaio/babel-web:${BABEL_WEB_TAG:-latest}
    container_name: babel-web
    ports:
      - "8090:8080"
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    volumes:
      # The apps to download, published by the app release workflow.
      - /opt/babel/downloads:/usr/share/nginx/downloads:ro

volumes:
  db-data:
  translate-models:
