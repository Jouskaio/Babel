[project]
name = "babel-api"
version = "0.45.3"
description = "Babel server API: library, annotated reading, sync and statistics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.15.1",
    "email-validator>=2.3.0",
    "aiosmtplib>=5.1.3",
    "python-multipart>=0.0.32",
    "defusedxml>=0.7.1",
    "cryptography>=46",
    "beautifulsoup4>=4.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx2>=2.13.1",
    "aiosqlite>=0.22.1",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babel_api"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # sorted imports
    "B",        # bugbear
    "UP",       # modern syntax
    "N",        # naming
    "SIM",      # simplifications
    "RUF",      # ruff-specific rules
    "ASYNC",    # asyncio pitfalls
    "S",        # security (bandit)
    "PT",       # style pytest
    "TID",      # banned imports (architecture rules)
]
ignore = ["RUF001"]  # user-facing strings may contain typographic characters

[tool.ruff.lint.per-file-ignores]
# FastAPI is only allowed in the HTTP layer, the entry point, scripts and tests.
"src/babel_api/api/**" = ["TID251"]
"src/babel_api/main.py" = ["TID251"]
"src/babel_api/scripts/**" = ["TID251"]
"tests/**" = ["S101", "S105", "S106", "TID251"]  # asserts and fake credentials are fine in tests

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The domain must not depend on any technical layer.
"fastapi".msg = "Domain and services must not depend on FastAPI (api/ layer only)."

# ---------------------------------------------------------------- Pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=babel_api --cov-report=term-missing"
