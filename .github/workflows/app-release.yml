name: App release

# Runs only for app tags created by `git flow release finish app-X.Y.Z`.
on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

env:
  # Tailscale MagicDNS name of the server
  DEPLOY_HOST: babel-api

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: flutter pub get
      # Signed with the release key kept in the repository secrets (same key every time, so
      # an update installs over the previous version).
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/babel.jks"
            echo "BABEL_KEYSTORE_FILE=$RUNNER_TEMP/babel.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release --dart-define=BABEL_API_URL=${{ vars.BABEL_API_URL }}
        env:
          BABEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BABEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BABEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: babel-android-${{ github.ref_name }}
          path: app/build/app/outputs/flutter-apk/app-release.apk

  macos:
    name: Build macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=BABEL_API_URL=${{ vars.BABEL_API_URL }}
      # Unsigned (ad hoc): first launch with right-click → Open.
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/Babel.app Babel-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: babel-macos-${{ github.ref_name }}
          path: app/Babel-macOS.zip

  web:
    name: Publish web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_OUTPUT"
      # Image names must be lowercase, while the owner name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/babel-web" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # No BABEL_API_URL: the web app calls the API on its own origin, under /api.
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: app
          file: app/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy the web app
    runs-on: ubuntu-latest
    needs: web
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Same access path as the API release: ephemeral tag:ci node + Tailscale SSH.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Upload the compose file
        run: |
          scp -o StrictHostKeyChecking=accept-new infra/docker-compose.yml \
            "deploy@${DEPLOY_HOST}:/opt/babel/docker-compose.yml"

      - name: Roll out the new version
        # The deployed version is also tagged latest on the server, so a manual
        # `docker compose up -d` never starts an older image. Images no container uses are
        # removed first: the disk fills up with old versions ("no space left on device").
        env:
          VERSION: ${{ needs.web.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -o StrictHostKeyChecking=accept-new "deploy@${DEPLOY_HOST}" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null \
             && cd /opt/babel \
             && mkdir -p /opt/babel/downloads \
             && docker image prune -af >/dev/null \
             && BABEL_WEB_TAG=${VERSION} docker compose pull web; \
             status=\$?; docker logout ghcr.io >/dev/null; [ \$status -eq 0 ] \
             && docker tag ghcr.io/jouskaio/babel-web:${VERSION} ghcr.io/jouskaio/babel-web:latest \
             && BABEL_WEB_TAG=${VERSION} docker compose up -d web"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS "http://${DEPLOY_HOST}:8090/healthz"; then exit 0; fi
            sleep 4
          done
          echo "::error::The web app did not become healthy after deployment"
          exit 1

  downloads:
    name: Publish the apps to download
    runs-on: ubuntu-latest
    needs: [android, macos, deploy]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only the apps: the web job's Docker build record is an artifact too, and not needed.
      - uses: actions/download-artifact@v7
        with:
          pattern: babel-*
          path: built
      - name: Name the files and write the manifest
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          mkdir -p dl
          cp built/babel-android-*/app-release.apk "dl/Babel-${VERSION}.apk"
          cp built/babel-macos-*/Babel-macOS.zip "dl/Babel-${VERSION}-macOS.zip"
          (cd api/src/babel_api/plugins/koreader && zip -qr "$GITHUB_WORKSPACE/dl/babel.koplugin.zip" babel.koplugin)
          python3 scripts/release-manifest.py "$GITHUB_REF_NAME" dl
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      # The manifest goes last: the apps it points to are already there.
      - name: Upload
        run: |
          scp -o StrictHostKeyChecking=accept-new dl/*.apk dl/*.zip "deploy@${DEPLOY_HOST}:/opt/babel/downloads/"
          scp dl/latest.json "deploy@${DEPLOY_HOST}:/opt/babel/downloads/latest.json"
          # Keep the two latest versions of each app.
          ssh "deploy@${DEPLOY_HOST}" 'cd /opt/babel/downloads && ls -t *.apk | tail -n +3 | xargs -r rm -f; ls -t *-macOS.zip | tail -n +3 | xargs -r rm -f'
