name: API release

# Runs only for API tags created by `git flow release finish api-X.Y.Z`.
on:
  push:
    tags: ["api-v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/babel-api
  # Tailscale MagicDNS name of the API server
  DEPLOY_HOST: babel-api

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=${GITHUB_REF_NAME#api-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the API server
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Joins the tailnet as an ephemeral tag:ci node, removed when the job ends.
      # Access to the server is granted by the Tailscale policy (Tailscale SSH),
      # so no SSH key is stored in GitHub.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Upload the compose file
        run: |
          scp -o StrictHostKeyChecking=accept-new infra/docker-compose.yml \
            "deploy@${DEPLOY_HOST}:/opt/babel/docker-compose.yml"

      - name: Roll out the new version
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "deploy@${DEPLOY_HOST}" \
            "cd /opt/babel && BABEL_API_TAG=${VERSION} docker compose pull api && BABEL_API_TAG=${VERSION} docker compose up -d api"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS "http://${DEPLOY_HOST}:8000/v1/health"; then exit 0; fi
            sleep 4
          done
          echo "::error::The API did not become healthy after deployment"
          exit 1
