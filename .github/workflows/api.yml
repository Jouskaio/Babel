name: API

on:
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api.yml"
  push:
    branches: [develop, master]
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest --cov-report=xml
      - name: Contract is up to date
        run: uv run python -m babel_api.scripts.export_openapi --check

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: babel
          POSTGRES_PASSWORD: babel
          POSTGRES_DB: babel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U babel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BABEL_DATABASE_URL: postgresql+asyncpg://babel:babel@localhost:5432/babel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      # Tests run on SQLite; this applies the same migrations to the production engine.
      - name: Apply migrations
        run: uv run python -m babel_api.scripts.migrate

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
