name: babel
description: "Babel — personal and social library (Flutter client, no server logic)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  firebase_core: ^3.12.0
  firebase_crashlytics: ^4.3.3
  firebase_analytics: ^11.4.0
  babel_api_client:
    path: ../packages/api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
