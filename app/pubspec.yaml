name: babel
description: "Babel — personal and social library (Flutter client, no server logic)."
publish_to: "none"
version: 0.4.1+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^8.2.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  babel_api_client:
    path: ../packages/api_client
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
