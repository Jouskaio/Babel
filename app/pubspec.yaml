name: babel
description: "Babel — personal and social library (Flutter client, no server logic)."
publish_to: "none"
version: 0.10.0+17

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^8.2.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  babel_api_client:
    path: ../packages/api_client
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  web: ^1.1.1
  cross_file: ^0.3.5+5
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  archive: ^4.3.0
  flutter_widget_from_html_core: ^0.17.4
  pdfrx: ^2.6.5
  xml: ^7.1.0
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
