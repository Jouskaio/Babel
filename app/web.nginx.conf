server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Password reset links carry a token in the URL: never leak it to other sites.
    add_header Referrer-Policy "no-referrer" always;

    # Never cache the entry points, so a new release is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }

    # Build artifacts change name or content with each release: cache them for a week.
    location ~* \.(?:js|wasm|css|png|jpg|svg|ico|otf|ttf|woff2?|json)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths are handled by the Flutter router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
