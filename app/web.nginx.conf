# Access log without query strings: emailed links carry single-use tokens.
log_format babel '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log babel;

    # Password reset links carry a token in the URL: never leak it to other sites.
    add_header Referrer-Policy "no-referrer" always;

    # Flutter web files keep the same names across releases (main.dart.js…): browsers must
    # revalidate them on every load (a cheap 304 when unchanged), or they would run an old
    # app for days after a release.
    location ~* \.(?:html|js|mjs|wasm|json)$ {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Fonts and images rarely change: a day of caching is enough.
    location ~* \.(?:css|png|jpg|svg|ico|otf|ttf|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths are handled by the Flutter router.
    location / {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
